name: Release

# Cutting a release is pushing a tag. Everything below follows from that, and the version the
# build is stamped with is the tag with its leading "v" removed.
#
# The version matters more than it looks: the app treats itself as a deployed build, and so
# starts checking for updates, only once its assembly version is above 0.0. A build left at the
# repository's own 0.0.0 will never update itself.
#
# Each platform builds on its own runner and hands its files to the release job, which is the
# only one that touches GitHub. A platform that fails takes the release with it, which is the
# point: a release quietly missing a platform is worse than one that did not happen.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Work out the version
      id: version
      run: |
        version="${{ github.event.inputs.version }}"
        [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
        echo "Building $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "TestCategory!=NoCI"

  windows:
    needs: [ version, test ]
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Publish
      run: |
        dotnet publish AWBWApp.Desktop/AWBWApp.Desktop.csproj \
          -c Release -r win-x64 --self-contained true \
          -p:Version=${{ needs.version.outputs.version }} \
          -p:FileVersion=${{ needs.version.outputs.version }} \
          -o publish

    # Squirrel ships inside the Clowd.Squirrel package the desktop project already depends on, so
    # the publish above has put it in the NuGet cache. Found rather than named, so that bumping
    # that dependency does not quietly break this.
    - name: Find Squirrel
      id: squirrel
      run: |
        path=$(find "$USERPROFILE/.nuget/packages/clowd.squirrel" -name Squirrel.exe | head -1)
        [ -n "$path" ] || { echo "Squirrel.exe is not in the NuGet cache"; exit 1; }
        echo "path=$path" >> "$GITHUB_OUTPUT"

    # Squirrel writes a delta against whatever it finds in the release directory, so pulling the
    # last release down first is what keeps an update a few hundred KB rather than sixty MB. There
    # is nothing to fetch for the first release, where this finds no releases and does nothing.
    - name: Fetch the previous release
      continue-on-error: true
      run: |
        "${{ steps.squirrel.outputs.path }}" github-down \
          -r Releases \
          --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
          --token "${{ secrets.GITHUB_TOKEN }}"

    - name: Pack
      run: |
        "${{ steps.squirrel.outputs.path }}" pack \
          -u AWBWReplayPlayer \
          -v ${{ needs.version.outputs.version }} \
          -p publish \
          -r Releases \
          --packTitle "AWBW Replay Player" \
          --packAuthors "DeamonHunter, Elagatua" \
          -i AWBWApp.Desktop/game.ico

    # Squirrel calls its installer Setup.exe. The name below is the one this project's releases
    # have always used, and the one anyone looking for a download will recognise.
    - name: Name the installer the way the releases do
      run: mv Releases/AWBWReplayPlayerSetup.exe Releases/AWBWReplayPlayerInstaller.exe

    # The previous release's full package was fetched so that a delta could be written against
    # it. Having served that purpose it is sixty megabytes of nothing: an install too old to
    # follow the deltas downloads the newest full package, never an older one. The deltas
    # themselves stay, because they are the update path.
    #
    # RELEASES is pruned to match. An index naming a package that is not there would be worse
    # than one entry short.
    - name: Leave behind what the next update will not need
      run: |
        find Releases -name '*-full.nupkg' ! -name '*-${{ needs.version.outputs.version }}-full.nupkg' -print -delete

        # Two things about this loop, both of which have already gone wrong once.
        #
        # The guard on read is because Squirrel writes RELEASES with no newline on the end, and
        # read reports failure on a last line that is not terminated - so the loop drops it. That
        # line is the full package, which is the one entry an install too old for the deltas needs
        # to find.
        #
        # The if is because this runs under bash -e, where a failing test at the end of a loop
        # body takes the whole job with it, on the very line whose purpose is to find something
        # missing.
        while IFS= read -r entry || [ -n "$entry" ]; do
          file=$(printf '%s' "$entry" | awk '{print $2}')

          if [ -f "Releases/$file" ]; then
            printf '%s\n' "$entry"
          fi
        done < Releases/RELEASES > RELEASES.pruned

        mv RELEASES.pruned Releases/RELEASES
        cat Releases/RELEASES

    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: Releases/*

  linux:
    needs: [ version, test ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    # zsync writes the .zsync file beside the AppImage, which is how an existing install works out
    # which few KB of a new one it actually needs.
    - name: Install the packaging tools
      run: sudo apt-get update && sudo apt-get install -y zsync desktop-file-utils

    - name: Publish
      run: |
        dotnet publish AWBWApp.Desktop/AWBWApp.Desktop.csproj \
          -c Release -r linux-x64 --self-contained true \
          -p:Version=${{ needs.version.outputs.version }} \
          -p:FileVersion=${{ needs.version.outputs.version }} \
          -o publish

    # An AppDir is the whole application plus three things at its root: something to run, a
    # desktop entry describing it, and an icon the entry names. The repository already carries a
    # 256px icon, so nothing has to be converted here.
    - name: Build the AppDir
      run: |
        mkdir -p AppDir/usr/bin
        cp -r publish/. AppDir/usr/bin/
        cp AWBWApp.Resources/Textures/Icon/ICO256.png AppDir/AWBWReplayPlayer.png

        cat > AppDir/AWBWReplayPlayer.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=AWBW Replay Player
        Comment=An Advance Wars By Web replay player
        Exec=AWBWReplayPlayer
        Icon=AWBWReplayPlayer
        Categories=Game;
        Terminal=false
        EOF

        # The executable's name has spaces in it, which is why this is a script rather than a
        # symlink into usr/bin.
        cat > AppDir/AppRun <<'EOF'
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "$0")")"
        exec "$HERE/usr/bin/AWBW Replay Player" "$@"
        EOF

        chmod +x AppDir/AppRun "AppDir/usr/bin/AWBW Replay Player"
        desktop-file-validate AppDir/AWBWReplayPlayer.desktop

    # Pinned rather than taken from the 'continuous' tag, so that a release built today and one
    # built next year are built by the same tool.
    #
    # The tool lives in its own repository now. The AppImageKit release it used to ship in is
    # still there, with every asset renamed to 'obsolete-' something, so the old URL answers with
    # a 404 page rather than an error - which is what --fail is for. Without it curl saves the
    # page as the tool and the failure surfaces two lines later as 'Not: command not found'.
    - name: Build the AppImage
      env:
        ARCH: x86_64
      run: |
        curl --fail -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        chmod +x appimagetool

        # Runners have no FUSE, so the tool has to unpack itself before it can run.
        ./appimagetool --appimage-extract-and-run \
          -u "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|AWBWReplayPlayer.AppImage.zsync" \
          AppDir AWBWReplayPlayer.AppImage

        ls -la AWBWReplayPlayer.AppImage AWBWReplayPlayer.AppImage.zsync

    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: |
          AWBWReplayPlayer.AppImage
          AWBWReplayPlayer.AppImage.zsync

  # Built on Linux, on purpose. Nothing here needs a Mac: the publish is a cross-compile, a
  # bundle is a directory with a plist in it, and the one thing that would genuinely require
  # macOS - signing - is not happening, because nobody here has an Apple Developer account.
  #
  # What a macOS runner does bring is a queue. GitHub's arm64 pool is capacity constrained, and
  # the first release that asked for one never got it: the job sat queued for fifteen minutes and
  # was cancelled with "The job was not acquired by Runner of type hosted". A release should not
  # be a lottery.
  macos:
    needs: [ version, test ]
    runs-on: ubuntu-latest

    env:
      APP: AWBW Replay Player.app

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    # Built for Intel rather than Apple silicon, which runs under Rosetta on both. A universal
    # bundle would mean publishing twice and splicing the two binaries together.
    - name: Publish
      run: |
        dotnet publish AWBWApp.Desktop/AWBWApp.Desktop.csproj \
          -c Release -r osx-x64 --self-contained true \
          -p:Version=${{ needs.version.outputs.version }} \
          -p:FileVersion=${{ needs.version.outputs.version }} \
          -o publish

    - name: Build the app bundle
      run: |
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp -R publish/. "$APP/Contents/MacOS/"
        cp AWBWApp.Resources/Textures/Icon/ICO256.icns "$APP/Contents/Resources/game.icns"

        cat > "$APP/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>AWBW Replay Player</string>
          <key>CFBundleDisplayName</key><string>AWBW Replay Player</string>
          <key>CFBundleIdentifier</key><string>com.github.elagatua.awbwreplayplayer</string>
          <key>CFBundleExecutable</key><string>AWBW Replay Player</string>
          <key>CFBundleIconFile</key><string>game</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${{ needs.version.outputs.version }}</string>
          <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.version }}</string>
          <key>LSMinimumSystemVersion</key><string>10.15</string>
          <key>NSHighResolutionCapable</key><true/>
        </dict>
        </plist>
        EOF

        # macOS will not launch a bundle whose executable is not marked as one, and nothing on
        # this side of the build sets that bit for it.
        chmod +x "$APP/Contents/MacOS/AWBW Replay Player"

        # Stands in for plutil -lint, which is only on macOS. A malformed plist would otherwise
        # travel all the way to someone's Mac before anything noticed.
        python3 -c "import plistlib, sys; plistlib.load(open(sys.argv[1], 'rb'))" "$APP/Contents/Info.plist"

    # This does NOT get the bundle past Gatekeeper, and is not meant to any more: a quarantined
    # copy is still refused with "is damaged and can't be opened", because an ad-hoc signature
    # carries no certificate and Gatekeeper treats that as no signature at all. Tested on a Mac
    # with v0.14.9. Only a Developer ID certificate plus notarization changes that dialog.
    #
    # It is here because what shipped before it was wrong on its own terms. dotnet publish ad-hoc
    # signs the apphost, so the executable was never unsigned - but nothing sealed the bundle
    # around it, and the apphost calls itself "apphost" rather than the Info.plist identifier.
    # Signing the bundle fixes both, and leaves the step a certificate can simply be named in.
    #
    # rcodesign reimplements codesign in Rust, so this stays on the Linux runner. It is pinned to a
    # tagged release and checked against the hash published beside it, for the same reason
    # appimagetool is pinned: a download that quietly answered with something else should fail here
    # rather than ship.
    - name: Sign the app bundle
      run: |
        tool=0.29.0
        archive="apple-codesign-$tool-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$tool/$archive"
        echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $archive" | sha256sum -c -
        tar xzf "$archive" --strip-components=1 \
          "apple-codesign-$tool-x86_64-unknown-linux-musl/rcodesign"

        # Naming no certificate is what makes it ad-hoc, and the bundle is rewritten in place.
        # Recursion is on by default, so the dylibs sitting beside the executable are signed too.
        # The hardened runtime is deliberately not asked for: it buys nothing without notarization,
        # and it would stop .NET's JIT dead.
        ./rcodesign sign "$APP"

        # Signing rewrites the executable, and whether the mode survives that is not something this
        # build should have to assume.
        chmod +x "$APP/Contents/MacOS/AWBW Replay Player"

        # Stands in for codesign -dv, which is only on macOS. A sign that found nothing to do still
        # exits zero, so this reads the Mach-O and insists the signature really landed in it.
        cat > signed.py <<'PY'
        import struct, sys

        path = sys.argv[1]
        with open(path, 'rb') as f:
            magic, _cpu, _subcpu, _filetype, ncmds = struct.unpack('<5I', f.read(20))
            if magic != 0xfeedfacf:
                sys.exit(f'{path}: not a thin 64-bit Mach-O (magic {magic:#x})')
            f.seek(32)  # past the rest of mach_header_64
            for _ in range(ncmds):
                cmd, size = struct.unpack('<2I', f.read(8))
                if cmd == 0x1d:  # LC_CODE_SIGNATURE
                    _dataoff, datasize = struct.unpack('<2I', f.read(8))
                    print(f'{path}: signed, {datasize} bytes of signature')
                    break
                f.seek(size - 8, 1)
            else:
                sys.exit(f'{path}: no LC_CODE_SIGNATURE, so the signing did nothing')
        PY
        python3 signed.py "$APP/Contents/MacOS/AWBW Replay Player"

    - name: Pack the app bundle
      run: |
        # -y keeps the symlinks inside the bundle as symlinks. Without it they are followed and
        # copied, which both bloats the archive and leaves a bundle macOS will not open. This is
        # what ditto -c -k would do on a Mac.
        zip -r -y -q AWBW.Replay.Player.app.zip "$APP"
        unzip -l AWBW.Replay.Player.app.zip | tail -3

    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: AWBW.Replay.Player.app.zip

  release:
    needs: [ version, windows, linux, macos ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true

    - run: ls -la assets

    # RELEASES and the nupkgs are not decoration: the in-app updater reads RELEASES to find out
    # what is available and downloads the packages beside it. A release missing them installs fine
    # and then never updates again.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ needs.version.outputs.version }}" \
          --repo "${{ github.repository }}" \
          --title "v${{ needs.version.outputs.version }}" \
          --generate-notes \
          --target "${{ github.sha }}" \
          assets/*
